spring.application.name=neesh-ai-backend
server.port=8081

# Database Configuration (Supabase)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.connection-timeout=30000

# HikariCP Connection Pool — conservative sizing for Supabase Free Tier
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=30000

# Tomcat Thread Pool — handle concurrent traffic
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=200

# Supabase Auth Configuration
# REQUIRED: Set SUPABASE_JWT_SECRET env var
supabase.jwt.secret=${SUPABASE_JWT_SECRET}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_URL:https://svtpjdaxikucgpflbeln.supabase.co}/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-post-size=52428800
server.tomcat.max-swallow-size=52428800

# Production Logging — minimal overhead
logging.level.com.zaxxer.hikari=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.neeshai.backend=INFO


# Resend Email Configuration
# Get API key from https://resend.com/api-keys
resend.api.key=${RESEND_API_KEY}
resend.from.email=${RESEND_FROM_EMAIL:Neesh AI <noreply@neeshglobal.com>}

# AI Service Configuration
ai.service.url=${AI_SERVICE_URL:http://localhost:3000}
ai.service.internal-api-key=${AI_SERVICE_INTERNAL_API_KEY:neesh-ai-secret-key-123}

# API Key Encryption
api.key.encryption.secret=${API_KEY_ENCRYPTION_SECRET:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY=}

# Supabase Admin (for password reset)
supabase.url=${SUPABASE_URL:https://svtpjdaxikucgpflbeln.supabase.co}
supabase.service.role.key=${SUPABASE_SERVICE_ROLE_KEY:}

# Cashfree Configuration
cashfree.app.id=${CASHFREE_APP_ID}
cashfree.secret.key=${CASHFREE_SECRET_KEY}
cashfree.api.url=${CASHFREE_API_URL:https://sandbox.cashfree.com/pg}
